<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#04070D;color:#fff;font-family:'Vazirmatn',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-tap-highlight-color:transparent}
main{width:100%;max-width:400px;padding:24px;text-align:center}
.logo{width:72px;height:72px;border-radius:20px;margin-bottom:20px;box-shadow:0 8px 32px rgba(46,124,246,.35)}
h1{font-size:16px;font-weight:500;color:#9FB3D1;margin:0 0 32px}
a{display:flex;align-items:center;gap:14px;width:100%;height:76px;border-radius:22px;padding:0 24px;margin-bottom:16px;text-decoration:none;font-size:21px;font-weight:700;letter-spacing:.2px;transition:transform .15s ease,opacity .15s ease}
a:active{transform:scale(.97)}
a:last-child{margin-bottom:0}
a svg{flex:0 0 auto}
a .chev{margin-inline-start:auto;opacity:.6}
.ios{background:#fff;color:#111}
.android{background:#0B57D0;color:#fff}
@media(prefers-reduced-motion:reduce){a{transition:none}}
</style>
